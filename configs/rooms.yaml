# ============================================================================
# 房间模板
# 结构、权重、数值全部写死；atmosphere_prompt 指向提示词文件名，描述由 AI 生成
#
# combat.enemy_bonus  —— 在遭遇表 count 基础上额外加几只
# loot.tables         —— 引用 balance.yaml 的 loot.category_tables 键
# loot.rolls          —— 掉几次
# special 房间由 mapgen 强制插入，不参与权重抽取（stairs 每层 1 个）
# ============================================================================

templates:

  combat:
    - id: street_ambush
      name: 街道伏击点
      level_min: 1
      level_max: 2
      enemy_bonus: 0
      vibe: 被遗弃的街道，翻倒的车辆和干涸的血迹

    - id: collapsed_apartment
      name: 倒塌居民楼
      level_min: 1
      level_max: 3
      enemy_bonus: 0
      vibe: 半边楼体垮了下来，家具悬在断口摇摇欲坠

    - id: parking_garage
      name: 地下车库
      level_min: 2
      level_max: 4
      enemy_bonus: 1
      light_cost: 2
      vibe: 漆黑的地下车库，只有手电光能照到的一小圈

    - id: metro_tunnel
      name: 地铁检修道
      level_min: 2
      level_max: 4
      enemy_bonus: 1
      light_cost: 1
      vibe: 检修道又窄又长，铁轨上停着一列永远不再出发的列车

    - id: pharmacy_backalley
      name: 药房后巷
      level_min: 3
      level_max: 5
      enemy_bonus: 1
      vibe: 药房后巷堆满过期药品的纸箱，空气里全是苦味

    - id: mall_atrium
      name: 商场中庭
      level_min: 4
      level_max: 6
      enemy_bonus: 1
      vibe: 挑空中庭挂着褪色的促销横幅，扶梯停在半途

    - id: rooftop_water_tank
      name: 天台水箱间
      level_min: 5
      level_max: 6
      enemy_bonus: 0
      vibe: 水箱间的门被风拍得砰砰响，能俯瞰半座城

    - id: sentry_base
      name: 哨塔底层
      level_min: 6
      level_max: 7
      enemy_bonus: 1
      vibe: 哨塔底层堆着沙袋和空弹匣，对讲机沙沙作响

    - id: supply_corridor
      name: 补给走廊
      level_min: 8
      level_max: 9
      enemy_bonus: 1
      vibe: 运输补给的手推车排成一列，像一支沉默的送葬队伍

    - id: comms_room
      name: 通讯机房
      level_min: 9
      level_max: 10
      enemy_bonus: 2
      vibe: 机房的服务器还在嗡嗡运行，指示灯在黑暗里明明灭灭

    - id: hospital_ward
      name: 住院病房
      level_min: 3
      level_max: 5
      enemy_bonus: 1
      infection_on_enter: [2, 5]
      vibe: 堆着尸袋的病房，空气里全是消毒水和腐臭

    - id: mall_corridor
      name: 商场走廊
      level_min: 4
      level_max: 5
      enemy_bonus: 1
      noise_on_enter: 1
      vibe: 警报长鸣的商场走廊，破碎的橱窗和散落的商品

    - id: rooftop_deck
      name: 天台平台
      level_min: 5
      level_max: 5
      enemy_bonus: 0
      vibe: 空旷的天台，风很大，远处有螺旋桨的声音

    # ---- 地区 2 · 军事检疫营地（P8） ----
    - id: checkpoint_ruins
      name: 哨卡残址
      level_min: 6
      level_max: 8
      enemy_bonus: 1
      vibe: 沙袋堆成的检查站，探照灯还亮着，射界扫过整条街
    - id: quarantine_tents
      name: 隔离军帐
      level_min: 6
      level_max: 8
      enemy_bonus: 1
      infection_on_enter: [1, 3]
      vibe: 成排的隔离帐篷，帐帘半开，里面传出拖行的脚步声
    - id: motor_pool
      name: 装甲车场
      level_min: 7
      level_max: 9
      enemy_bonus: 1
      noise_on_enter: 1
      vibe: 报废的装甲车挤满车场，履带缝里长出了草
    - id: command_floor
      name: 指挥楼层
      level_min: 9
      level_max: 10
      enemy_bonus: 2
      vibe: 作战室的地图墙上插满红旗，每一面都代表一个死掉的哨所

  loot:
    - id: pharmacy
      name: 药房
      tables: [medical]
      rolls: [1, 2]
      pry_required: false
      vibe: 被翻得一片狼藉的药房，货架倒在地上

    - id: gun_store
      name: 枪店
      level_min: 1
      level_max: 2
      tables: [ammo, weapons]
      rolls: [1, 2]
      pry_required: true
      noise_on_pry: 2
      vibe: 枪店的柜台还在，玻璃展柜碎了一地

    - id: supermarket
      name: 超市
      tables: [food]
      rolls: [1, 3]
      vibe: 空荡荡的超市，货架上只剩过期食品

    - id: wrecked_car
      name: 废弃车辆
      tables: [material, ammo]
      rolls: [1, 1]
      pry_required: true
      noise_on_pry: 2
      vibe: 停在路边的废弃车辆，车门半开着

    - id: locker_room
      name: 更衣室
      tables: [trinket, medical]
      rolls: [1, 1]
      vibe: 更衣室，储物柜大多被撬开了

    # ---- 地区 2 · 军事检疫营地（P8）：军械富集 ----
    - id: armory_locker
      name: 军械柜
      level_min: 6
      level_max: 10
      tables: [weapons, ammo, military_supplies]
      rolls: [1, 2]
      pry_required: true
      noise_on_pry: 2
      vibe: 一排武器架，枪大多被拿走了，剩下的那几支看运气
    - id: supply_crate
      name: 军需补给箱
      level_min: 6
      level_max: 10
      tables: [ammo, food, medical, military_supplies]
      rolls: [1, 2]
      vibe: 堆在墙角的军用补给箱，封条大多完好
    - id: field_armory
      name: 军械库房
      level_min: 8
      level_max: 10
      tables: [weapons, gear, military_supplies]
      rolls: [1, 2]
      pry_required: true
      noise_on_pry: 3
      vibe: 库房深处的重械架，防弹插板和夜视仪散了一地

  empty:
    - id: quiet_hall
      name: 空旷大厅
      vibe: 空旷的大厅，回声很重
    - id: broken_stairs
      name: 坍塌的楼梯间
      vibe: 坍塌的楼梯间，水泥块堵住了去路
    - id: office
      name: 办公室
      vibe: 无人办公区，显示器还亮着屏保

  event:
    - id: event_anchor
      name: 事件点
      vibe: 一处安静的角落，但安静得让人不安

  # 墓碑房。P4 会替换成真正的玩家墓碑注入；
  # 首批先用「无名遗骸」占位，保证空服务器时这个房型也有内容。
  grave:
    - id: unknown_remains
      name: 无名遗骸
      vibe: 有人在这里停下过，然后就再也没起来

  # 商人：用废铁修复近战武器、买卖少量基础物资。
  # 走 mapgen 的 room_weights 生成（不是 special 房），所以正常参与权重抽取。
  merchant:
    - id: wandering_trader
      name: 流浪商人
      level_min: 1
      level_max: 10
      vibe: 一个裹着破毯子的身影在翻拣货物，看见你眼睛亮了一下——「废铁换命，懂？」

  # ============================================================================
  # 灾害房（P6.2.2）：进房立刻吃一发「开场伤害」，之后玩家有 countdown 个行动窗口。
  # 每个行动（搜刮/翻找/移动…）都会推进倒计时——归零时触发 worsening（恶化）。
  # choices 走事件同款加权 outcomes 语法（p 之和 1.0，加载时校验）。
  #   grab/dig —— 赌一把拿高价值物资（quality 加成），可能挨罚
  #   press_on —— 不贪，安全通过（无奖励无惩罚）
  # ============================================================================
  hazard:
    - id: gas_leak
      name: 毒气渗漏
      level_min: 1
      level_max: 10
      countdown: 3
      onset: {infection: [1, 3]}
      worsening: {infection: [2, 5]}
      vibe: 黄绿色的雾从通风管里渗出来，贴着地面慢慢漫开
      choices:
        - id: grab
          label: 憋气冲进雾里翻找
          noise: 1
          outcomes:
            - {p: 0.55, loot_category: medical, quality: 1, text: 你在雾最浓的货架后摸到了还封着的医疗物资。}
            - {p: 0.25, loot_category: material, quality: 1, text: 工具柜里有几样好东西，你抓起来就跑。}
            - {p: 0.20, infection: [2, 4], text: 一口没忍住，你吸进了满满一肺的腐甜空气。}
        - id: press_on
          label: 屏住呼吸快步通过
          outcomes:
            - {p: 1.0, text: 你用袖子捂住口鼻，贴着雾的边缘快步穿了过去。}

    - id: collapsing_floor
      name: 坍塌现场
      level_min: 2
      level_max: 10
      countdown: 3
      onset: {cut: [1, 3]}
      worsening: {cut: [2, 5], noise: 2}
      vibe: 天花板塌了一半，断梁和碎块悬在头顶摇摇欲坠
      choices:
        - id: dig
          label: 在瓦砾里刨一刨
          noise: 1
          outcomes:
            - {p: 0.45, loot_category: material, quality: 1, text: 塌掉的储物间里压着几箱没烂的东西。}
            - {p: 0.20, loot_category: ammo, quality: 1, text: 你从瓦砾下拖出一个弹药盒。}
            - {p: 0.35, cut: [2, 5], text: 你拉动的那根断梁带动了整片碎块。}
        - id: press_on
          label: 贴墙小心绕过
          outcomes:
            - {p: 1.0, text: 你听着头顶的呻吟声，一点一点挪了过去。}

  # ============================================================================
  # 变异巢穴（P6.2.2）：进房必遇敌（enemy_bonus 额外加怪），清巢后自动「割巢」
  # 拿高价值掉落（harvest_tables / harvest_quality / harvest_rolls）。
  # 只进分支权重——绕路有风险也有收益；主线不刷。
  # ============================================================================
  nest:
    - id: fleshy_nest
      name: 变异巢穴
      level_min: 1
      level_max: 3
      enemy_bonus: 2
      harvest_tables: [material, medical]
      harvest_rolls: 2
      harvest_quality: 1
      vibe: 墙上覆着一层搏动的肉质组织，中间是一窝扭曲的卵
    - id: brood_chamber
      name: 孵育腔
      level_min: 4
      level_max: 5
      enemy_bonus: 3
      harvest_tables: [ammo, medical]
      harvest_rolls: 2
      harvest_quality: 2
      harvest_cash: [3, 8]
      vibe: 整个房间被变异组织吞没，中央的卵囊还在缓缓开合
    # ---- 地区 2 · 军事检疫营地（P8） ----
    - id: kennel_nest
      name: 军犬舍
      level_min: 6
      level_max: 9
      enemy_bonus: 2
      harvest_tables: [ammo, medical]
      harvest_rolls: 2
      harvest_quality: 1
      vibe: 一排排铁丝犬笼全部被从里面撞开，食盆里长出了霉
    - id: command_nest
      name: 指挥所巢穴
      level_min: 9
      level_max: 10
      enemy_bonus: 3
      harvest_tables: [ammo, gear]
      harvest_rolls: 2
      harvest_quality: 2
      harvest_cash: [5, 12]
      vibe: 作战室里的一切都被肉质组织包裹，话筒里还在传出呼吸声

  special:
    - id: stairs_down
      name: 下行通道
      kind: stairs
      vibe: 一道向下的开口，里面黑得看不见底
    - id: campfire
      name: 篝火
      kind: campfire
      heal: 6
      infection: -10
      stamina: 10
      once_per_level: true
      ambush_chance: 0.25
      vibe: 有人在角落生过火，灰烬还是温的
    - id: survivor_npc
      name: 幸存者
      kind: npc
      hostile_if_infection_ge: 75
      trade: true
      # 只收废料（拾荒者不认纸币）；scrap_rate = 物品 value × 该系数 = 废料价
      scrap_rate: 0.6
      share_humanity: 5      # 分食物的人道收益
      buy_humanity: 1        # 每次购买的人道收益
      gift_chance: 0.4       # 分享后回赠的概率
      vibe: 有活人的气息，对方也在打量你

# 锁门躲避尸潮（第 4 层商场机制）
lockable_room:
  id: shutter_room
  name: 卷帘门仓库
  levels: [4]
  duration: 3          # 躲避回合数
  pry_cost: 1          # 消耗撬棍耐久
  noise_reduction: 4
