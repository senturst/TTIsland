# ============================================================================
# 天赋池
#
# 触发时机：玩家**复活进场**时三选一（上一局撤离成功则不触发——
# 通关奖励已经给过满耐久遗物和撤离津贴了，再叠天赋会让"故意去死"变成最优解）。
#
# 定位：这是**死亡补偿（pity）**，不是成长系统。
#   1. 只在本局生效，不累积、不带出
#   2. 三选一是随机的，玩家拿不到想要的那个是常态
#   3. 单个天赋对撤离率的提升必须 ≤ +3%（scripts/sim.py --talents 会逐条验证）
#   4. 但也不能鸡肋——每个天赋都要有玩家**当场就能感觉到**的场景
#
# mods 字段是纯数据，由 core/talents.py 读取，各系统自行消费。
# 新增天赋只改这个文件，不用动代码。
# ============================================================================

draw_count: 3

talents:

  # ---------------- 生存 ----------------
  - id: tough_body
    name: 强健体质
    desc: 最大生命 +5
    weight: 10
    mods: {hp_max: 5}

  - id: quick_clot
    name: 快速凝血
    desc: 开局额外携带 2 个绷带
    weight: 9
    mods: {start_items: [[bandage, 2]]}

  - id: resistant
    name: 抗性体质
    desc: 受到的感染 −30%
    weight: 9
    mods: {infection_taken_mult: 0.7}

  - id: seasoned
    name: 老练
    desc: 每下一层额外回复 2.5% 生命
    weight: 8
    mods: {descend_heal_add: 0.025}

  # ---------------- 输出 ----------------
  - id: brute_strength
    name: 臂力过人
    desc: 近战伤害 +8%
    weight: 10
    mods: {melee_dmg_pct: 0.08}

  - id: steady_aim
    name: 枪法娴熟
    desc: 枪械伤害 +9%
    weight: 9
    mods: {ranged_dmg_pct: 0.09}

  - id: cold_blood
    name: 冷血
    desc: 暴击率 +4%
    weight: 8
    mods: {crit: 0.04}

  - id: nimble
    name: 身手矫健
    desc: 敏捷 +3（更容易先手与逃脱）
    weight: 8
    mods: {agility: 3, flee_bonus: 10}

  - id: desperado
    name: 亡命之徒
    desc: 生命低于 30% 时，伤害 +15%
    weight: 7
    mods: {low_hp_dmg_pct: 0.15}

  # ---------------- 资源 ----------------
  - id: scavenger
    name: 拾荒直觉
    desc: 搜刮时 35% 概率多找到一次
    weight: 9
    mods: {loot_extra_roll_chance: 0.35}

  - id: packrat
    name: 背包客
    desc: 背包容量 +5
    weight: 7
    mods: {bag_slots: 5}

  - id: hoarder
    name: 囤积癖
    desc: 开局弹药 +6
    weight: 8
    mods: {ammo_start: 6}

  - id: electrician
    name: 电工
    desc: 手电电量上限 +35（第 2 层很关键）
    weight: 7
    mods: {flashlight_bonus: 35}

  # ---------------- 机动 ----------------
  - id: nightwalker
    name: 夜行者
    desc: 尸潮触发阈值 +2，噪音衰减加快 60%
    weight: 8
    mods: {noise_decay_mult: 1.6, horde_threshold_delta: 2}

  - id: light_step
    name: 轻步
    desc: 开枪与撬门的噪音 −1
    weight: 7
    mods: {noise_add_delta: -1}

  # ---------------- 趣味（弱，但有用）----------------
  - id: collector
    name: 收藏癖
    desc: 纪念品得分翻倍（不影响战斗）
    weight: 5
    mods: {trinket_score_mult: 2.0}

  - id: smoker
    name: 老烟枪
    desc: 开局携带伏特加（临时 +10 命中，但 +3 感染）
    weight: 5
    mods: {start_items: [[vodka, 1]]}
