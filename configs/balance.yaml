# ============================================================================
# 全局平衡常量
# 这一份是数值总闸。调手感优先改这里，不要散到代码里。
# 字段解释：
#   hit_floor / hit_ceiling —— 命中率钳制上下限，永远不出现必中或必空
#   dot_per_room / dot_per_turn —— 每进一房 / 每回合末固定扣血
# ============================================================================

config_version: 1

player:
  # 数值经过 scripts/sim.py 上千局模拟校准。
  # 全程期望承伤约 200，而可用血池（初始 HP + 沿途治疗）约 120，
  # 差额靠"逃跑、绕路、用手电省遭遇"来补——这正是玩家该动脑的地方。
  hp: 40
  stamina: 20
  strength: 6
  agility: 5
  acc: 88
  eva: 12
  crit: 0.05
  crit_mult: 1.8
  armor: 0
  ammo_start: 12
  # 开局武器（必须在 items.yaml 中存在）
  start_weapon: crowbar
  # 开局消耗品 [item_id, 数量]
  start_items:
    - [bandage, 1]
  # 背包容量（格）。单格 = 一个物品条目；可堆叠物资（弹药/绷带/材料/纪念品）
  # 只占 1 格（qty 累加不占格），所以天然限制"无限囤积"。
  # 总容量 = 这里 + 背包天赋 + 已装备背包 slots + 护甲口袋 pockets。
  bag_slots: 8

# 下楼时回一点血。
# 没有它，整局就是一条单向消耗的血条——前面多掉一点血，后面通过率就全线崩，
# 每层的难度根本没法独立调（实测：前三层的密度只涨 0.06，L5 通过率就从 44% 掉到 29%）。
# 有了层间喘息，每层才成为一个可以单独校准的单元。
progression:
  descend_heal_pct: 0.12    # 按最大生命的比例回复

combat:
  hit_floor: 5
  hit_ceiling: 95
  # 力量加成的分母：floor(STR / str_divisor) 加进伤害
  str_divisor: 2
  # 逃跑：base + per_agi * (玩家AGI - 敌AGI)
  flee_base: 40
  flee_per_agi: 5
  flee_clamp: [10, 90]
  # 逃跑失败时敌人免费打一次的概率
  flee_fail_punish_chance: 0.75
  # 逃跑=冲刺，无论成败都扣体力（测试以本键为准，不再有"引擎已移除"的说法）。
  flee_stamina_cost: 5
  # 敌人越多越难脱身：每只**额外**敌人（超出 1 只的部分）−2% 逃跑率，被 flee_clamp 钳制。
  flee_per_enemy: 2
  # 逃跑成功率按扣减前的当前体力加成：每点体力额外 +0.5%——满体力（100）多 50%，
  # 被 flee_clamp 钳制。体力越满越容易逃掉，让"拼了命地跑"有真实收益。
  flee_stamina_bonus_pct: 0.2
  # 体力→战斗：消耗体力"瞄准"，换临时命中加成。设计红线：绝不对命中做任何体力惩罚，
  # 低体力只是用不了"瞄准"，绝不会降低基础命中。
  brace_stamina_cost: 5
  brace_acc_bonus: 15
  brace_turns: 3
  # 防具按「等级」直接抵消伤害（百分比吸伤），取代旧的固定减伤数值。
  # 每只怪独立结算：命中后先按 tier 比例吸伤（至少吸 min_absorb 点），
  # 吸掉的量转为防具耐久损耗；耐久耗尽则不再吸伤。
  # 远程枪械命中率不受体力影响——这里只描述防具，命中公式本来就不含体力项。
  armor_absorb:
    tiers: {1: 0.10, 2: 0.18, 3: 0.25}   # 最低级 10% → 最高级 25%
    min_absorb: 1                          # 每次受击至少吸 1 点（防具永远有点用）

infection:
  max: 100
  bands:
    - {min: 25, name: 低烧, hp_max_pct: -0.10, acc: -5}
    - {min: 50, name: 溃烂, hp_max_pct: -0.25, acc: -10, dot_per_room: 1}
    # 75+ 给增益而不是纯惩罚，让高感染成为可玩的策略位置
    - {min: 75, name: 狂躁, acc: +10, dmg_pct: +0.20, dot_per_turn: 2, npc_hostile: true}
    - {min: 100, name: 尸化, zombify: true}
  # 尸变模式：选"继续"后的存活房间数与能力加成
  zombify:
    max_rooms: 3
    stat_mult: 1.3
  sources:
    bite: [3, 6]
    blood_pool: [2, 4]
    raw_food: 5
  relief:
    antibiotic: -25
    campfire: -10
    clean_water: -5
    bandage: -5

noise:
  max: 10
  # 进入新层时噪音保留比例（0.1 = 降低 90%）。防"来回走房间刷衰减洗白噪音"：
  # 同层衰减可以靠反复移动刷，跨层保留则洗不掉。调这里即可改强度。
  keep_ratio_on_enter: 0.1
  # 每移动一个房间自然衰减
  decay_per_room: 0.0
  sources:
    gunshot: 4
    silenced: 1
    gun_kill: 3
    melee_kill: 0
    pry: 2
    sprint: 2
    glass: 1
  horde:
    threshold: 8
    end: 4
    extra_spawn: [3, 6]
    density_mult: 2.0
    # 尸潮被消灭后按下述比例削掉噪音（可配置）。打完一波尸潮等于把整层的
    # 东西都吵醒了——响过之后的死寂应该比来之前更安静。
    clear_noise_cut: 0.30
    # 楼梯口守门精英（避战流太强：不能让玩家全程绕着所有战斗走）
    elite:
      monster: gatekeeper     # 守在楼梯口的怪物 ID（skip_levels 之外的层）——地区 1
      # 地区精英：按地区覆盖上面的全局默认（地区 2 = 变异军士）
      monsters:
        1: gatekeeper
        2: sergeant
      no_flee: true           # 对守门精英不可用逃跑——必须打
      skip_levels: [1]        # 这些层不设精英（新手层别一上来就锁死退路）
      normal_monster: ghoul   # skip 层的替代：一只高级小怪（普通战斗，可逃跑）

# 遗物继承（软 Roguelite）
# 风险：高层拿到好装备 → 死亡继承 → 前期碾压 → 更容易活到高层 → 更好的装备。
# 正反馈一旦跑起来，roguelike 的难度曲线就废了。三道闸封死：
#   1. tier 上限——重火力（消防斧/霰弹枪）根本不能带走
#   2. 传承衰减——每传一代伤害与耐久都缩水，越传越差
#   3. 代次上限——传满 max_passes 代直接报废，任何装备都有寿命
# 另外"单槽位"本身就是限制：新遗物会顶掉旧的，无法累积。
legacy:
  max_tier: 2
  max_passes: 3
  weapon_dmg_mult: 1.0      # 每传承一代的伤害倍率
  durability_mult: 0.75       # 每传承一代的耐久倍率
  armor_penalty: 1           # 每传承一代护甲值扣减
  # 纪念品无属性，不衰减，可以一直传下去（它们是情感物件，不是数值）

  # ---------- 撤离 vs 死亡：留下的东西质量不同 ----------
  # 如果两者代价一样，最优解就变成"反正装备都要丢，不如早点死"，
  # 难度曲线会被这个策略架空。所以：
  #   撤离 = 把装备保养好带回家 → 耐久全满、传承次数不增加、另有津贴
  #   死亡 = 从尸体上捡回来的  → 耐久衰减、传承次数 +1、其余装备流落进墓碑池
  escape:
    keep_passes: true        # 撤离不增加传承次数
    restore_durability: true # 撤离时耐久回满
    stipend:
      ammo: [ammo_t2, 6]
      item: bandage

loot:
  # 掉落大类权重
  category_weights:
    ammo: 20
    food: 20
    medical: 20
    material: 22
    trinket: 10
    gear: 8
  ammo_per_drop: [2, 4]      # 每次弹药掉落 2-4 发 → 每层期望 6-10 发
  category_tables:
    ammo: [ammo_t1, ammo_t2, ammo_t3]
    food: [canned, clean_water, vodka, energy_drink]
    medical: [bandage, antibiotic, medkit, painkiller, disinfectant]
    material: [battery, scrap, duct_tape, alcohol]
    trinket: [wedding_ring, dog_tag, photo]
    gear: [small_pack, hiking_pack, large_pack]
  # 近战武器耐久归零后伤害倍率
  broken_weapon_mult: 0.5
  # 搜索多件：拿到第一件后，按 p·decay^(k-1) 续 roll，直到失败或到顶 N
  # 这是"废铁/装备来源"的核心——让单次搜索有概率摸到好几样，缓解二层以后没武器
  search:
    max_items: 3            # 单次搜索最多获得的物品数（可调）
    extra_base_chance: 0.3  # 拿到第 1 件后，续得第 2 件的基础概率
    extra_decay: 0.2        # 每多一件，续 roll 概率乘以该系数（第 3 件 = 0.6×0.5）

# 现金（局内货币）：搜索时「独立」概率获取的额外掉落，不走类别权重。
# 与上面的类别掉落互不干扰——摸没摸到物资，都另掷一次骰决定给不给现金。
loot_cash:
  chance: 0.12           # 每次搜索独立判定
  min: 1
  max: 5

# 商人（用废铁 / 现金交易；铺货随机；含作者怜悯与感染商人）
merchant:
  # ---- 修理：近战武器与护甲都可修，玩家「选择」用废料还是现金 ----
  # 每次点击消耗 1 份资源、修 floor(1/per) 点耐久，零头舍弃（不强制一次修满），
  # 非商人区域也可用废料修（同一入口）。天赋 repair_bonus 让一次修多点。
  repair:
    scrap_per_point: 0.3          # 每 1 废料修 3 点耐久（0.3/点，余数舍弃）
    cash_per_point: 0.5           # 每 1 现金修 2 点耐久（与废料二选一）
    tape_points: 2                # 每 1 胶带修 2 点耐久（胶带=应急补，固定点数不吃单价换算）
    target: both                  # both=修近战武器与护甲；melee_only=只修近战

  # ---- 铺货模板：固定 1 武器位 / 1 装备位（护甲或背包）/ 1 背包位 / 3 其他位 ----
  # 进入商人房间时按此随机生成 shop（每个位从对应池各抽 1 件），全部可配。
  shop_slots:
    weapon: 1      # 池：items.weapons（排除近战起始撬棍等无意义项由引擎过滤）
    gear: 1        # 池：items.armor ∪ items.backpacks
    backpack: 1    # 池：items.backpacks
    other: 3       # 池：ammo/consumable/material/trinket
  # 其他位候选池（避免全是废铁；含少量武器弹药与消耗品）
  other_pool: [ammo_t1, ammo_t2, ammo_t3, bandage, medkit, canned,
               battery, scrap, duct_tape, alcohol, painkiller, disinfectant,
               wedding_ring, dog_tag, photo]
  # 卖出价 = 物品 value × sell_ratio（向下取整，至少 1）
  sell_ratio: 0.5
  # 收购门槛：武器/护甲耐久低于总耐久该比例时拒收（0 耐久必拒）。
  # 防止"把打空的装备全卖给商人"变成无本废品回收生意；想修好再卖去修。
  # 无耐久概念的物品（纪念品/材料等）不受此门槛约束。
  min_durability_ratio: 0.5

  # ---- 作者怜悯：极低概率触发，仅普通商人；玩家免费任选一件 ----
  authors_mercy_chance: 0.01      # 默认 1%

  # ---- 感染商人：进入后可「上交 toll_hp 生命」换取**下一次购买**半价
  #      （一次性，用掉可再交）。商店按原价铺货，没有门槛、没有抽血 ----
  plagued:
    spawn_chance: 0.15            # 普通商人房间中出现感染商人的概率
    toll_hp: 20                   # 每次上交的生命值
    discount: 0.50                # 上交后的购买折扣系数（0.5 = 半价）

# 幸存者 NPC（P6.2.2）：主干房间按概率出现的活人（special/survivor_npc 模板）。
# 感染 ≥ 75（npc_hostile 档）时对方先动手——狂躁的玩家会被当成了怪物。
survivor_npc:
  spawn_chance: 0.18          # 每层主干房间替换为 NPC 的概率（每层至多 1 个，L2+）
  min_level: 2                # 第 1 层不放——新手刚下井就撞见活人太挤
  stock_rolls: 2              # 铺货件数（从 merchant.other_pool 里抽，只收废料）

mapgen:
  rooms_base: 8
  rooms_rand: 6              # 房间数 = base + rand(0, rand)
  main_path_ratio: 0.6       # 主干长度占比
  branch_min: 1
  branch_max: 2              # 每个分支挂 1-2 房（死胡同）
  # 高层分支占比更高，探索收益随深度上升
  branch_ratio_by_level:
    1: 0.20
    2: 0.25
    3: 0.30
    4: 0.35
    5: 0.40
    # ---- 地区 2 · 军事检疫营地 ----
    6: 0.40
    7: 0.40
    8: 0.45
    9: 0.45
    10: 0.40
  # 主干 / 分支上的房间类型权重
  # hazard/nest 只进分支（P6.2.2）——灾害与巢穴都是「绕路赌一把」，不该堵在主干上
  room_weights:
    main:   {combat: 40, loot: 20, event: 15, empty: 15, grave: 5,  special: 5, merchant: 5}
    branch: {combat: 20, loot: 25, event: 12, empty: 4,  grave: 16, special: 5, merchant: 5, hazard: 8, nest: 5}
  # 商人保底：每层必出的商人房数量（key=层数）。1-4 层各保底 2 个，
  # 撤离层（第 5 层）节奏特殊不保底。不足时从普通房随机改铸补足。
  merchant_guarantee:
    1: 0
    2: 1
    3: 0
    4: 1
    # ---- 地区 2：血税商人（补给线被切断，商人更稀缺） ----
    6: 1
    7: 0
    8: 1
    9: 0

# ============================================================================
# P7 升级系统（本局内成长，死亡清零）
# ============================================================================
growth:
  xp_base: 60               # 升到第 1 级所需 XP
  xp_curve: 1.4             # 每级需求 ×1.4（60 → 84 → 118 → 165）
  # 击杀 XP 来自 monsters.yaml 的 xp 字段；守门精英/Boss 击杀直接升 1 级
  # 一局基准：12 杀×10 + 3 精英(直升) + Boss(直升) ≈ 期望 2-3 级、上限 5 个天赋

# ============================================================================
# 平衡目标
#
# pass_rate_by_level[L] = 「活着进入第 L 层的玩家，活着走出去」的概率。
# 连乘即整局撤离率：0.88 × 0.76 × 0.65 × 0.55 × 0.45 ≈ 10.7%
#
# ## 为什么定这么低
# 这五层是**地区 1，不是整个游戏**。设计目标是多周目循环：
#   玩家反复刷地区 1 → 攒装备强化自身 → 去挑战后续地区。
# 撤离本来就应该是稀缺事件（约十局一次），而不是"打完一遍就通关毕业"。
#
# ## 为什么第二轮仍然会翻车
# 单局通过率只有 ~10%，意味着即使装备略有提升，方差也足以让玩家栽跟头。
# 遗物传承每代都在衰减（见 legacy），硬性封顶 3 代——
# 玩家能靠刷取缩短"运气不好"的概率，但永远买不到"稳过"。
#
# **基准不含任何外来加成**：这个目标是按"无遗物、不摸墓碑"的裸开局校准的。
# 遗物与墓碑收益只能让玩家**逼近**目标，不应显著超过它，否则就是滚雪球。
# ============================================================================
targets:
  pass_rate_by_level:
    1: 0.88
    2: 0.76
    3: 0.65
    4: 0.55
    5: 0.45
    # ---- 地区 2：整体压一档（用户拍板）——连乘 ≈ 6.9% 单地区撤离率 ----
    6: 0.80
    7: 0.68
    8: 0.57
    9: 0.47
    10: 0.37
  tolerance: 0.06          # 超过这个偏差就认为需要回调
  # 雪球容忍度：拿到遗物后，整局撤离率的提升不应超过这个值。
  # 这条同时保证"第一轮通关 ≠ 第二轮稳过"。
  max_legacy_gain: 0.05

scoring:
  per_kill: 8
  per_level: 50
  escape_bonus: 200
  boss_kill_bonus: 150
  # 分数 = 击杀分 + 深度分 + 撤离/Boss 奖励 + 剩余物资折算
  ammo_score: 1
  trinket_score: 15
