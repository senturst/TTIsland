# ============================================================================
# 天赋池
#
# 两个来源（P7 升级系统）：
#   * 开局（复活进场）三选一：死亡补偿；上一局撤离成功则不触发
#   * 局内升级三选一：击杀 XP 攒条 / 精英·Boss 直升；排除已拥有的
#
# 定位与强度：
#   * 开局天赋 = 入场补偿；升级天赋 = 本局成长。都只在单局生效，死亡清零
#   * 多天赋叠加：数值型求和（再拿一次同类的会叠上去）
#   * 单天赋对撤离率的提升必须 ≤ +3%（scripts/sim.py --talents 逐条验证）
#   * 池子要够大（30+）：一局最多 5 次抽取 ×3 选项 + 排除已有，不够会重复
#
# mods 字段是纯数据，由 core/talents.py 聚合读取，各系统自行消费。
# 新增天赋只改这个文件，不用动代码。
#
# 可用 mods 键（消费方）：
#   hp_max            生命上限        combat.player_profile / apply 即时生效
#   start_items       开局物资        apply 即时生效 [id, 数量]
#   infection_taken_mult  感染乘数    run_service._add_infection
#   food_infection_bonus 吃抑制类物品感染多减1（run_service._act_use，仅负感染生效）
#   descend_heal_add  下楼回血加成    _descend
#   melee_dmg_pct / ranged_dmg_pct    combat.player_profile
#   crit / acc / eva / armor          combat.player_profile
#   low_hp_dmg_pct / low_hp_threshold 亡命之徒类
#   loot_extra_roll_chance            搜索多掷一次
#   bag_slots / ammo_start / flashlight_bonus
#   noise_decay_mult / noise_add_delta / horde_threshold_delta   noise 模块
#   flee_bonus         逃跑加成（/5 折算敏捷）
#   agility            敏捷
#   repair_bonus       修理费率折扣
#   trinket_score_mult 纪念品得分乘数
#   melee_lifesteal    近战吸血（击杀回血，P7 新增消费点）
#   ammo_scav_mult     弹药拾取乘数（P7 新增消费点）
#   stamina_max        体力上限（P7 新增消费点）
#   brace_acc_bonus_add 瞄准额外命中（P7 新增消费点）
#   XP
# ============================================================================

draw_count: 3

talents:

  # ---------------- 生存 ----------------
  - id: tough_body
    name: 强健体质
    desc: 最大生命 +5
    weight: 10
    mods: {hp_max: 5}

