# ============================================================================
# 五层主题
# 每层靠"唯一机制"区分，而不是把数值线性放大。
# 数值只有小幅增长，改变的是玩家的决策结构。
#
# hooks 由 core/level_rules.py 消费：
#   on_enter_level  —— 进入该层时执行一次
#   before_room     —— 每进入一个房间前
#   on_turn         —— 战斗每回合
#   modifier        —— 常驻修正
# ============================================================================

levels:

  1:
    id: 1
    name: 废弃街区
    icon: "🏙️"
    subtitle: 地表 · 日光尚在
    brief: 灾难刚过去不久。阳光还能照到街面，物资也还没被搜干净。
    mechanism: 日光
    mechanism_desc: 视野良好，搜刮效率 +50%。这是你囤积物资的最后机会——新手地图，掉率上调，但怪物本身不弱。
    entry_text: 你从藏身的地下室爬出来。街上很安静，安静得过分。
    exit_text: 你找到一处通往地下的检修井。往下走，光线开始消失。
    modifiers:
      loot_rolls_mult: 1.5       # 相比其它层更慷慨的掉率（新手友好）
      search_extra_flat: 0.2     # 搜索续 roll 概率额外 +20%，更容易一次摸到多件
    on_enter_level:
      infection_decay: 0
    zombie_density: 0.96
    # 层主题专属：无
    hooks: []

  2:
    id: 2
    name: 地下车库
    icon: "🅿️"
    subtitle: 负一层 · 断电
    brief: 应急灯早就没电了。你的手电是唯一光源，而电池不会自己长出来。
    mechanism: 手电电量
    mechanism_desc: 电量初始 100。每探索一房 −4，战斗每回合 −2。归零后命中 −25、遭遇率 ×1.5、无法搜刮。
    entry_text: 井盖在你身后合上。黑暗像水一样漫过来，你拧亮了手电。
    exit_text: 通风管道的另一头传来消毒水的味道。是医院。
    modifiers:
      flashlight_enabled: true
      flashlight_start: 100
      flashlight_cost_per_room: 4
      flashlight_cost_per_turn: 2
      flashlight_dead_acc_penalty: -25
      flashlight_dead_encounter_mult: 1.5
      flashlight_dead_no_search: true
    on_enter_level:
      flashlight: 100
    zombie_density: 0.97
    hooks: [flashlight_drain]

  3:
    id: 3
    name: 中心医院
    icon: "🏥"
    subtitle: 二层 · 病毒培养区
    brief: 这里曾是最后一个还在运转的地方。也正因如此，这里的空气最脏。
    mechanism: 高危污染区
    mechanism_desc: 30% 的房间是高危区，进入 +8 感染，但医疗掉落 ×3。整个楼层每回合 +1 感染——培养区的空气本身就在侵蚀你。要不要赌，取决于你的抗生素还剩几支。
    entry_text: 走廊两侧堆着来不及运走的尸袋。墙上的指示牌还亮着一点微光。
    exit_text: 你从医院后门出来，正对着商场的卸货区。
    modifiers:
      hazmat_room_chance: 0.30
      hazmat_infection: 8
      hazmat_medical_bonus: 3
      infection_per_turn: 1
    on_enter_level: {}
    zombie_density: 0.88
    hooks: [hazmat_zone]

  4:
    id: 4
    name: 万达商场
    icon: "🏬"
    subtitle: 三层 · 警报系统
    brief: 这里的警报在混乱中被触发过。它没停，也永远不会停。
    mechanism: 警报系统
    mechanism_desc: 噪音基线 5 且自然衰减减半。钢卷帘门可锁住一个房间躲避尸潮（消耗撬棍耐久）。战利品品质 +1 档。
    entry_text: 刺耳的警报声从天花板传来，节奏很稳定，像心跳。
    exit_text: 消防通道的尽头是天台。你在很远的地方听见了螺旋桨的声音。
    modifiers:
      noise_floor: 3
      noise_decay_mult: 0.5
      loot_quality_bonus: 1
      lockable_rooms: true
    on_enter_level:
      noise: 5
    zombie_density: 0.7
    hooks: [alarm_system, lockable_room]

  5:
    id: 5
    name: 天台
    icon: "🚁"
    subtitle: 顶层 · 撤离点
    brief: 直升机不会等你第二次。到了这一层，别再翻箱子了。
    mechanism: 撤离倒计时
    mechanism_desc: 30 回合内必须抵达撤离点。倒计时归零则直升机离开。暴君 T-03 守在撤离点——可以打掉它拿额外分，也可以用噪音把它引开绕过去。直奔撤离点来得及，沿途搜刮就来不及了。
    entry_text: 推开天台的门，风很大。远处的探照灯扫过来，你看见直升机的轮廓。
    exit_text: ""
    modifiers:
      evac_countdown: 42
      boss_room: true
    on_enter_level:
      evac_countdown: 42
    zombie_density: 0.69
    hooks: [evac_countdown, boss]

  # ============ 地区 2 · 军事检疫营地（P8，6-10 层） ============
  # 难度立场（用户拍板）：整体压一档——密度与遭遇数量高于地区 1，
  # 目标通过率 80/68/57/47/37（targets 同步）。机制先复用现有钩子，
  # 军事特色主要由遭遇表（新怪）与房间模板（军械富集）承载。

  6:
    id: 6
    name: 前哨外围
    icon: "🚧"
    subtitle: 封锁线 · 警戒区
    brief: 军方在这里设过检查站，后来检查站成了第一个沦陷的地方。
    mechanism: 戒严巡逻
    mechanism_desc: 封锁区的巡逻密度远高于城区——几乎每个房间都有东西在等你。没有花招，就是多。
    entry_text: 探照灯还亮着，鹿砦后面堆着沙袋和没人认领的尸体。铁丝网上挂着一块牌子：检疫管制，禁止通行。
    exit_text: 铁丝网在身后哗啦作响。你钻进了隔离带。
    modifiers: {}
    on_enter_level: {}
    zombie_density: 0.95
    hooks: []

  7:
    id: 7
    name: 铁丝网隔离带
    icon: "⛓️"
    subtitle: 封锁线 · 隔离带
    brief: 铁丝网割开了每一寸捷径。这里只剩下它们留给你走的那条路。
    mechanism: 隔离带
    mechanism_desc: 没有特殊机制——但狭窄的地形意味着遭遇不会少。省着点子弹。
    entry_text: 缠绕的铁丝网一直延伸到视线尽头，每隔几米挂着一具穿军装的尸体。
    exit_text: 你穿过隔离带。前面的建筑门口停着军车——军械库区到了。
    modifiers: {}
    on_enter_level: {}
    zombie_density: 0.93
    hooks: []

  8:
    id: 8
    name: 军械库区
    icon: "🪖"
    subtitle: 封锁线 · 军械库
    brief: 库房的卷帘门被从里面撞开过。架子上还剩什么，全看运气。
    mechanism: 军械富集
    mechanism_desc: 搜刮次数 ×1.4，武器与弹药的出率明显更高。带不走的枪比丧尸更让人心疼。
    entry_text: 库房里堆满打开的板条箱，防弹插板散了一地，有人在这里武装到牙齿之后也没能走出去。
    exit_text: 你推开指挥中心的大门。里面亮着应急灯。
    modifiers:
      loot_rolls_mult: 1.4
    on_enter_level: {}
    zombie_density: 0.9
    hooks: []

  9:
    id: 9
    name: 指挥中心
    icon: "🗺️"
    subtitle: 封锁线 · 指挥部
    brief: 作战地图还钉在墙上，红线画到的位置一片漆黑。
    mechanism: 指挥部卫队
    mechanism_desc: 精英与重装单位的比例大增。真正的硬仗都在这一层——撑过去，停机坪就在楼上。
    entry_text: 电台里有人在循环呼叫一个早已不存在的番号。桌上的咖啡杯里长出了霉。
    exit_text: 楼梯通向天台。风里全是旋翼的声音。
    modifiers: {}
    on_enter_level: {}
    zombie_density: 0.88
    hooks: []

  10:
    id: 10
    name: 停机坪
    icon: "🚁"
    subtitle: 顶层 · 撤离点
    brief: 军用直升机的残骸堆在停机坪边缘。真正能飞的那架在中央，旋翼正在预热。
    mechanism: 撤离倒计时
    mechanism_desc: 36 回合内必须抵达撤离点，并消灭尸潮指挥官「葬列」——它穿着全套防弹插板，正面的每一寸都硬得像墙。
    entry_text: 停机坪的风比天台更烈。那东西就站在直升机的舱门前面，像是在等什么，又像是在守什么。
    exit_text: ""
    modifiers:
      evac_countdown: 36
      boss_room: true
    on_enter_level:
      evac_countdown: 36
    zombie_density: 0.72
    hooks: [evac_countdown, boss]

boss:
  id: tyrant_t03
  name: 暴君 T-03
  room_name: 撤离点
  guards_evac: true
  # 引开机制已整体下线（用户拍板）：暴君必须正面击杀，没有绕过选项。
  # 此前 success_chance 0.65 的噪音引开让 L5 通过率虚高，撤离段失去威胁。
  # lure: 配置保留但引擎不再消费（_act_lure 直接拒绝，按钮不再暴露）。
  lure:
    noise_threshold: 9
    lure_turns: 3
    success_chance: 0.0
    enabled: false
  encounter_text: 它站在停机坪中央，像是在等什么。或者说，像是在守什么。
  kill_text: 庞大的身躯终于倒下。你跨过它，走向直升机。
