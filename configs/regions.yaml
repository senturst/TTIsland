# ============================================================================
# 地区系统（P6.2.1）
#
# 每个地区 = 连续的一组层。层的主题/机制细节仍在 level_themes.yaml，
# 这里只定义"世界结构"：哪几层属于哪个地区、解锁条件、展示信息。
#
# 解锁规则：玩家从某地区最后一层（直升机撤离点）撤离成功后，解锁下一地区。
# 多周目循环的设计立场：已解锁地区可反复刷，后续地区难度不降——
# 解锁是"进门资格"，不是"变强保证"。
#
# placeholder: true 的地区是结构占位，尚未实装：
#   不参与 max_level、不参与配置校验、玩家不可进入。
# ============================================================================

regions:

  1:
    id: 1
    name: 疫城废墟
    icon: "🏚️"
    subtitle: 地区一 · 起点之城
    brief: 直升机从这座城市接走幸存者。要坐上它，得先从日光下的街区一路下到天台。
    levels: [1, 2, 3, 4, 5]

  2:
    id: 2
    name: 封锁线之外
    icon: "🌫️"
    subtitle: 地区二 · 未实装
    brief: 直升机不会往那边飞。据说围墙外的城市更老、更饿。
    placeholder: true
    levels: []
