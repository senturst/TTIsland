# ============================================================================
# 物品表
# 全部数值写死，只有 desc_ai=true 的条目其描述文本由 AI 生成
#
# 武器字段：
#   dmg        —— 基础伤害区间（尚未算力量与护甲）
#   acc_mod    —— 命中修正，直接加进命中公式
#   noise      —— 噪音来源键，null 表示近战不产生噪音
#   ammo_per_shot / ammo_type —— 枪械消耗；弹药按 tier 统合：t1 枪用 ammo_t1，以此类推
#   burst      —— 连射：一次攻击随机射出 [min, max] 发，每发独立结算伤害与命中
#   durability —— 近战武器可用次数，归零后伤害 ×broken_weapon_mult
#   aoe        —— 远程全体攻击（对每个敌人单独结算伤害与闪避）。霰弹枪类专用。
#
# value       —— 价值属性（货币结算用）：商人回收/出售价、装备价值展示都基于它
# ============================================================================

weapons:
  # 拳头：默认近战兜底，不占背包、不出现在掉落/商店。
  # 继承到远程武器时近战手段只剩它—— durability: null = 无耐久概念（永不磨损）。
  - id: fists
    name: 拳头
    icon: "✊"
    kind: melee
    dmg: [1, 2]
    acc_mod: -10
    crit: 0.03
    noise: 0
    durability: null
    weight: 0
    tier: 1
    value: 0

  - id: crowbar
    name: 撬棍
    icon: "🔧"
    kind: melee
    dmg: [6, 10]
    acc_mod: 0
    crit: 0.05
    noise: 0
    durability: 20
    pry: true
    weight: 30
    tier: 1
    value: 8
    desc_ai: true

  - id: fire_axe
    name: 消防斧
    icon: "🪓"
    kind: melee
    dmg: [7, 12]
    acc_mod: -5
    crit: 0.10
    noise: 0
    durability: 25
    pry: true
    weight: 10
    tier: 3
    value: 25
    desc_ai: true

  - id: machete
    name: 砍刀
    icon: "🔪"
    kind: melee
    dmg: [5, 9]
    acc_mod: +5
