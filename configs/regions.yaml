# ============================================================================
# 地区系统（P6.2.1 / P8 实装地区 2）
#
# 每个地区 = 连续的一组层。层的主题/机制细节仍在 level_themes.yaml，
# 这里定义"世界结构"：哪几层属于哪个地区、地区 Boss 是谁、解锁条件、展示信息。
#
# 解锁规则：玩家从某地区最后一层（直升机撤离点）撤离成功后，解锁下一地区。
# 多周目循环的设计立场：已解锁地区可反复刷，后续地区难度不降——
# 解锁是"进门资格"，不是"变强保证"。
#
# boss：该地区撤离点（最后一层）驻守的地区 Boss，击杀后才能登机。
#       从地区最后一层的 level_theme boss 段迁移至此——Boss 是地区身份的一部分。
# ============================================================================

regions:

  1:
    id: 1
    name: 疫城废墟
    icon: "🏚️"
    subtitle: 地区一 · 起点之城
    brief: 直升机从这座城市接走幸存者。要坐上它，得先从日光下的街区一路下到天台。
    levels: [1, 2, 3, 4, 5]
    boss: tyrant_t03

  2:
    id: 2
    name: 军事检疫营地
    icon: "🎖️"
    subtitle: 地区二 · 封锁线之外
    brief: 疫情爆发后军方在这里拉起封锁线，然后封锁线本身变成了坟场。军械还在，弹药还响，穿防弹衣的东西在巡逻。
    levels: [6, 7, 8, 9, 10]
    boss: horde_marshal
    # 远程枪械的主场（用户拍板）：噪音上限 10 → 30。
    # 尸潮触发线/平息线/自然衰减按上限同比例放大（×3），改的是"可以更吵"
    # 的预算，不是尸潮频率。
    noise_max: 30
