    weight: 7
    tier: 3
    value: 28
    desc_ai: true

  - id: silenced_smg
    name: 消音冲锋枪
    icon: "🔫"
    kind: ranged
    dmg: [6, 9]
    acc_mod: +5
    crit: 0.12
    noise_key: silenced
    ammo_type: ammo_t3
    ammo_per_shot: 1
    burst: [3, 5]
    # 消音+连射本属超模组合，故 tier 抬到 3：改烧稀缺的重弹药（t3）
    # 是它的主要代价，稀有度也控制在霰弹枪一档
    weight: 5
    tier: 3
    value: 28
