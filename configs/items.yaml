  # ---- 地区 2 · 军事检疫营地军械（P8） ----
  - id: assault_rifle
    name: 突击步枪
    icon: "🔫"
    kind: ranged
    dmg: [7, 11]
    acc_mod: +10
    crit: 0.10
    ammo_type: ammo_t3
    ammo_per_shot: 1
    burst: [2, 5]
    # 军械库的制式装备：单发威力与连射上限都比消音冲锋枪高一档，
    # 代价是没有消音（gunshot 噪音）且更稀有（weight 更低）
