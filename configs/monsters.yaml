# ============================================================================
# 怪物表
# 全部数值写死，只有 flavor_short 由 AI 生成（见 ai_fields）
#
# 字段：
#   archetype  —— 行为原型，决定 AI 行为分支（core/combat.py 消费）
#                shambler 迟钝直冲 / rusher 高速突进 / grabber 抓握减命中
#                spitter 远程喷吐 / brute 高血高伤 / boss 技能循环
#   bite_chance / bite_infection —— 撕咬触发率与感染增量
#   on_death   —— 死亡特效（肿尸爆炸）
#   on_hit     —— 命中特效（尖啸者加噪音）
#   ai_fields  —— 声明哪些字段交给 AI 生成
# ============================================================================

ai_fields: [flavor_short]

templates:
  base: &base
    hp: 12
    dmg: [3, 5]
    acc: 55
    eva: 5
    crit: 0.02
    armor: 0
    speed: 5
    archetype: shambler
    bite_chance: 0.25
    bite_infection: [3, 6]
    xp: 10
    score: 8

monsters:
  - id: walker
    name: 行尸
    icon: "🧟"
    <<: *base
    desc: 最常见的感染者。动作迟缓，但成群时依然是死因。

  - id: runner
    name: 奔跑者
    icon: "🏃"
    <<: *base
    hp: 10
    dmg: [2, 4]
    eva: 15
    speed: 9
    archetype: rusher
    desc: 肌肉尚未完全僵死，冲刺速度远超常人。

  - id: bloater
    name: 肿尸
    icon: "💥"
    <<: *base
    hp: 22
    dmg: [3, 5]
    acc: 50
    eva: 0
    speed: 3
    archetype: brute
    bite_chance: 0.15
    on_death:
      explode:
        dmg: [4, 8]
        infection: [8, 15]
        noise: 3
    desc: 体内充满腐败气体，死时会炸开一团毒雾。

  - id: screamer
    name: 尖啸者
    icon: "📢"
    <<: *base
    hp: 14
    dmg: [1, 3]
    acc: 55
    speed: 6
    on_hit:
      noise_add: 3
    desc: 它的叫声会把方圆百米的东西全引过来。

  - id: lurker
    name: 潜伏者
    icon: "👤"
    <<: *base
    hp: 16
    dmg: [4, 6]
    acc: 68
    eva: 10
    speed: 7
    ambush: true
    archetype: grabber
    desc: 不发出任何声音，等你走到最近的距离才动手。

  - id: ghoul
    name: 食尸鬼
    icon: "🧟‍♂️"
    <<: *base
    hp: 20
    dmg: [4, 6]
    acc: 62
    speed: 7
    bite_chance: 0.40
    bite_infection: [6, 10]
    desc: 以尸体为食的变异体，攻击性极强。守着尸堆不愿离开。

  - id: gatekeeper
    name: 守门者
    icon: "🗿"
    <<: *base
    # 精英守门怪（不可逃跑必须打赢）：数值须高于普通怪（ghoul 20血/4-6伤/62命中），
    # 否则"单挑守门人"比被杂兵围殴还轻松。强度以"比 ghoul 高一档、
    # 不至于把各层通过率砸穿"为准：sim n=400 验证撤离率 ~8-9%（基线 9.5%）。
    hp: 20
    dmg: [4, 6]
    acc: 62
    eva: 5
    armor: 1
    speed: 6
    archetype: brute
    bite_chance: 0.28
    bite_infection: [4, 7]
    elite: true               # 楼梯口守卫：不可逃跑，必须消灭才能下楼
    score: 40
    xp: 30
    desc: 不知是谁把守楼梯这件事刻进了它腐烂的本能。它不追人，也不离开。

  - id: tyrant_t03
    name: 暴君 T-03
    icon: "👹"
    <<: *base
    hp: 65
    dmg: [6, 9]
    acc: 75
    eva: 5
    armor: 2
    speed: 6
    archetype: boss
    boss: true
    score: 150
    abilities:
      - id: charge
        name: 冲撞
        cooldown: 4
        dmg: [9, 13]
        noise: 5
    desc: 实验体编号 T-03。它守在撤离点，像是被命令过。

  # ---------------- 地区 2 · 军事检疫营地（P8） ----------------
  # 设计基调：玩家此时已有 t2-t3 装备与升级，普通怪整体比地区 1 高一档；
  # 数值先按"比地区 1 同位怪高 30-50%"给骨架，再跑 sim 校准。

  - id: soldier
    name: 变异士兵
    icon: "🪖"
    <<: *base
    hp: 18
    dmg: [2, 4]
    acc: 65
    armor: 1
    speed: 5
    # 扫射（P8 用户拍板）：多发低伤——防弹衣的百分比吸收逐发生效，
    # 对弹幕比对单发大伤害更有效
    burst: [2, 3]
    bite_chance: 0.20
    bite_infection: [4, 8]
    score: 12
    xp: 14
    desc: 军装还在身上，枪也还在手里。它用短点射完成了最后一次巡逻。

  - id: war_hound
    name: 军犬
    icon: "🐕"
    <<: *base
    hp: 9
    dmg: [2, 5]
    acc: 60
    eva: 20
    speed: 11
    archetype: rusher
    bite_chance: 0.45
    bite_infection: [2, 5]
    score: 10
    xp: 12
    desc: 检疫营地最忠诚的哨兵。死去很久了，叫声还是那么亮。

  - id: riot
    name: 防暴兵
    icon: "🛡️"
    <<: *base
    hp: 28
    dmg: [4, 7]
    acc: 58
    eva: 0
    armor: 3
    speed: 4
    archetype: brute
    bite_chance: 0.15
    bite_infection: [3, 6]
    score: 18
    xp: 20
    desc: 全套防暴装备把它锁在了里面。甲很硬，里面的东西已经不在了。

  - id: burner
    name: 燃烧兵
    icon: "🔥"
    <<: *base
    hp: 18
    dmg: [3, 6]
    acc: 55
    speed: 6
    on_death:
      explode:
        dmg: [5, 9]
        infection: [0, 0]
        noise: 4
    score: 14
    xp: 15
    desc: 烧夷弹把它点着了，也把它的怨火点着了。倒下时记得离远点。

  - id: sergeant
    name: 变异军士
    icon: "🎖️"
    <<: *base
    # 地区 2 楼梯守门精英：对位 gatekeeper（20hp/4-6/62命中/甲1）高一档
    hp: 30
    dmg: [2, 4]
    acc: 68
    eva: 5
    armor: 2
    speed: 6
    burst: [3, 6]
    bite_chance: 0.30
    bite_infection: [5, 9]
    elite: true
    score: 60
    xp: 45
    desc: 军衔还别在领口。它守着封锁线的每一道门，直到命令被撤销——或者你被撤销。

  - id: horde_marshal
    name: 葬列
    icon: "☠️"
    <<: *base
    # 地区 2 Boss：装甲尸潮指挥官。对位暴君（65hp/6-9/75命中/甲2）压一档：
    # 血更厚、甲更硬，伤害峰值更高；两个技能循环（冲撞 + 尸潮践踏）。
    hp: 100
    dmg: [2, 6]
    acc: 72
    eva: 5
    armor: 3
    speed: 6
    archetype: boss
    boss: true
    score: 300
    xp: 80
    # 普通攻击 = 尸潮弹幕扫射（多发低伤，防弹衣逐发吸收）；
    # 技能（装甲冲撞/尸潮践踏）保留单发重击节奏
    burst: [3, 6]
    abilities:
      - id: marshal_charge
        name: 装甲冲撞
        cooldown: 4
        dmg: [10, 15]
        noise: 5
      - id: marshal_stomp
        name: 尸潮践踏
        cooldown: 6
        dmg: [7, 11]
        noise: 8
    desc: 它生前指挥过整条封锁线。现在它指挥的只有尸潮——而尸潮对它唯命是从。

# 每层遭遇表
#   count   —— 单次遭遇的敌人数量区间
#   weights —— 怪物权重（高层引入更危险的怪）
encounter_tables:
  per_level:
    1:
      count: [1, 3]
      weights: {walker: 85, runner: 15}
    2:
      count: [1, 3]
      weights: {walker: 80, runner: 20}
    3:
      count: [2, 3]
      weights: {walker: 60, runner: 25, bloater: 15}
    4:
      count: [2, 3]
      weights: {walker: 45, runner: 30, bloater: 15, screamer: 10}
    5:
      count: [2, 3]
      weights: {walker: 35, runner: 30, lurker: 20, bloater: 15}
    # ---- 地区 2 · 军事检疫营地（压一档：数量与怪强度同步上调） ----
    6:
      count: [2, 3]
      weights: {walker: 30, runner: 25, soldier: 25, war_hound: 20}
    7:
      count: [2, 4]
      weights: {walker: 20, runner: 25, soldier: 20, war_hound: 20, lurker: 15}
    8:
      count: [2, 4]
      weights: {walker: 15, runner: 20, soldier: 25, riot: 15, burner: 10, bloater: 15}
    9:
      count: [3, 4]
      weights: {soldier: 25, riot: 20, runner: 20, burner: 15, lurker: 10, bloater: 10}
    10:
      count: [3, 4]
      weights: {soldier: 25, riot: 20, burner: 15, runner: 20, walker: 10, screamer: 10}

# 尸潮追加的追击者
horde:
  monster: runner
  count: [3, 6]
