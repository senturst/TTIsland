# ============================================================================
# 物品表
# 全部数值写死，只有 desc_ai=true 的条目其描述文本由 AI 生成
#
# 武器字段：
#   dmg        —— 基础伤害区间（尚未算力量与护甲）
#   acc_mod    —— 命中修正，直接加进命中公式
#   noise      —— 噪音来源键，null 表示近战不产生噪音
#   ammo_per_shot / ammo_type —— 枪械消耗
#   durability —— 近战武器可用次数，归零后伤害 ×broken_weapon_mult
# ============================================================================

weapons:
  - id: crowbar
    name: 撬棍
    icon: "🔧"
    kind: melee
    dmg: [6, 10]
    acc_mod: 0
    crit: 0.05
    noise: 0
    durability: 20
    pry: true
    weight: 30
    tier: 1
    desc_ai: true

  - id: fire_axe
