<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>孤岛残响 · 管理后台</title>
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body>
  <!-- 登录 -->
  <div id="login" class="login-wrap">
    <div class="login-card">
      <h1>管理后台</h1>
      <p class="muted">请输入配置文件中的管理令牌。</p>
      <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off" />
      <button id="login-btn">登录</button>
      <div id="login-err" class="err"></div>
    </div>
  </div>

  <!-- 主控 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <span class="brand">孤岛残响 · 管理后台</span>
      <button id="logout-btn" class="ghost">退出登录</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="config">配置管理</button>
      <button class="tab" data-tab="players">玩家管理</button>
      <button class="tab" data-tab="stats">数据统计</button>
    </nav>

    <!-- 配置 -->
    <section id="config-panel" class="panel">
      <div class="config-layout">
        <div class="config-files">
          <h3>配置文件</h3>
          <div id="config-files" class="file-list"></div>
        </div>
        <div class="config-editor">
          <div class="row">
            <strong id="config-name">—</strong>
            <button id="config-save" class="primary">保存</button>
          </div>
          <textarea id="config-text" spellcheck="false" placeholder="选择左侧文件…"></textarea>
          <div id="config-status" class="status"></div>
        </div>
      </div>
    </section>

    <!-- 玩家 -->
    <section id="players-panel" class="panel hidden">
      <div class="players-layout">
        <div class="players-list">
          <h3>存活在玩的玩家</h3>
          <table id="players-table">
            <thead>
              <tr><th>名字</th><th>层</th><th>HP</th><th>感染</th><th>战斗</th><th>分数</th></tr>
            </thead>
            <tbody id="players-body"></tbody>
          </table>
          <div id="players-status" class="status"></div>
        </div>
        <div class="player-detail hidden" id="player-detail">
          <div class="row">
            <strong id="player-name">—</strong>
            <button id="player-back" class="ghost">返回列表</button>
            <button id="player-save" class="primary">保存全部</button>
          </div>
          <div id="player-status" class="status"></div>

          <!-- 普通值：输入框 -->
          <h3>数值</h3>
          <div class="val-grid">
            <label>生命 <input id="v-hp" type="number" /></label>
            <label>生命上限 <input id="v-hp-max" type="number" /></label>
            <label>感染% <input id="v-infection" type="number" /></label>
            <label>体力 <input id="v-stamina" type="number" /></label>
            <label>现金 <input id="v-cash" type="number" /></label>
            <label>废料 <input id="v-scrap" type="number" /></label>
            <label>胶带 <input id="v-tape" type="number" /></label>
            <label>分数 <input id="v-score" type="number" /></label>
          </div>

          <!-- 背包：每行一格，下拉替换 -->
          <h3>背包（<span id="inv-cap">0</span> 格）</h3>
          <div id="inv-rows" class="inv-rows"></div>

          <details class="adv">
            <summary>高级：完整状态 JSON（武器/护甲/装备槽/clip 等深度编辑）</summary>
            <textarea id="player-state" spellcheck="false"></textarea>
            <div class="row"><button id="player-save-json" class="primary">保存 JSON</button></div>
          </details>
        </div>
      </div>
    </section>

    <!-- 数据统计（P8）：死亡分布 + 各层通过率（排除主动放弃） -->
    <section id="stats-panel" class="panel hidden">
      <div class="row">
        <h3>死亡分布（地区 · 层）</h3>
        <button id="stats-refresh" class="ghost">刷新</button>
      </div>
      <p class="muted" id="stats-summary">统计口径：只计已完结的局；进行中与主动放弃不计入。</p>
      <table id="deaths-table">
        <thead>
          <tr><th>地区</th><th>层</th><th>死亡次数</th></tr>
        </thead>
        <tbody id="deaths-body"></tbody>
      </table>

      <h3>各层通过率</h3>
      <table id="passrate-table">
        <thead>
          <tr><th>层</th><th>地区</th><th>到达人数</th><th>通过人数</th><th>通过率</th></tr>
        </thead>
        <tbody id="passrate-body"></tbody>
      </table>
    </section>
  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
